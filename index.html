<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <title>__APP_NAME__</title>
    <meta name="description" content="__APP_DESCRIPTION__" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <!-- iOS のホーム画面追加用 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="__APP_SHORT_NAME__" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      アクセス数の計測（GoatCounter）。クッキーも個人情報も使わない。
      localhost と file:// は count.js 側で自動的に除外されるので、開発中は記録されない。
      オフラインのときは読み込みに失敗するだけで、アプリの動作には影響しない。
    -->
    <script
      data-goatcounter="https://km-apps.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
